<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>No Again 😠</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
font-family:Poppins;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:white;
text-align:center;
}
@keyframes angry{
0%{transform:translateX(0);}
20%{transform:translateX(-4px);}
40%{transform:translateX(4px);}
60%{transform:translateX(-4px);}
80%{transform:translateX(4px);}
100%{transform:translateX(0);}
}
.angry-bear{
width:170px;
margin:20px auto;
display:block;
animation:angry .5s infinite;
}
button{
padding:12px 30px;
border-radius:25px;
border:none;
background:#f6b1c3;
color:#7a1f33;
font-size:16px;
cursor:pointer;
}
</style>
</head>
<body>
<div>
<img src="angry_bear.png" class="angry-bear">
<h2>did you say no???? 😠</h2>
<button onclick="location.href='page4.html'">try again</button>
</div>
</body>
</html>
