<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
font-family:Poppins,Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:white;
text-align:center;
}
.container{max-width:400px}
button{
padding:12px 30px;
border-radius:25px;
border:none;
background:#f6b1c3;
color:#7a1f33;
font-size:16px;
margin:10px;
cursor:pointer;
}
@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}
.cute-cat{
width:140px;
margin:20px auto;
display:block;
animation:bounce 2s infinite;
}
</style>
</head>
<body>
<div class="container">
<h2>Hey! I made something for you<br>do you wanna see???</h2>
<img src="cat.png" class="cute-cat">
<button onclick="yes()">Yes</button>
<button onclick="no()">No</button>
</div>
<script>
function yes(){location.href="page3.html"}
function no(){location.href="page2.html"}
</script>
</body>
</html>
