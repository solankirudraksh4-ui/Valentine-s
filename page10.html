<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Final Gift 💝</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
font-family:Poppins;
height:100vh;
background:#ffd1dc;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}
.ticket{
background:#ffb6c6;
padding:15px;
margin:10px;
border-radius:15px;
}
button{
margin-top:20px;
padding:12px 36px;
border-radius:30px;
border:none;
background:#f6b1c3;
color:#7a1f33;
font-size:16px;
cursor:pointer;
}
.heart{
position:fixed;
top:-10px;
font-size:22px;
animation:fall linear forwards;
pointer-events:none;
}
@keyframes fall{
to{transform:translateY(110vh);opacity:0;}
}
</style>
</head>
<body>

<div>
<div class="ticket"><b>HUGS</b><br>unlimited hugs 🫂</div>
<div class="ticket"><b>MAALKIN SPECIAL</b><br>whatever maalkin says, I'll follow 🫡</div>
<div class="ticket"><b>KISSES</b><br>infinite kisses whenever maalkin wants 😘💋</div>
<div class="ticket"><b>ALWAYS AVAILABLE</b><br>this slave of yours will always be available for you 😤</div>
<button onclick="restart()">Restart 🔁</button>
</div>

<script>
const hearts=["🩷","🫶","💝","💖","💕","💞","💓","💗","💘"];
function createHeart(){
const h=document.createElement("div");
h.className="heart";
h.innerText=hearts[Math.floor(Math.random()*hearts.length)];
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(2+Math.random()*2)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),4000);
}
function restart(){
for(let i=0;i<40;i++){
setTimeout(createHeart,i*100);
}
setTimeout(()=>location.href="index.html",2500);
}
</script>

</body>
</html>
