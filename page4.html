<style>
body{
margin:0;
font-family:Poppins;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:white;
text-align:center;
}
@keyframes wiggle{
0%{transform:rotate(0deg);}
25%{transform:rotate(-2deg);}
50%{transform:rotate(2deg);}
75%{transform:rotate(-2deg);}
100%{transform:rotate(0deg);}
}
.shy-cat{
width:170px;
margin:20px auto;
display:block;
animation:wiggle 2s infinite;
}
button{
padding:12px 30px;
border-radius:25px;
border:none;
background:#f6b1c3;
color:#7a1f33;
font-size:16px;
margin:10px;
cursor:pointer;
}
</style>
